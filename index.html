<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src https://*.dropboxusercontent.com https://www.dropbox.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Consulta</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1a5fb4;--bd:#dcdcd6;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#9a9a94;--ac:#7fb0ff;--bd:#383836;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:8px 0 16px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:12px;background:var(--card);color:var(--tx)}
input{width:100%}
button{cursor:pointer;color:var(--ac);font-weight:600}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
form{display:flex;gap:8px}
#msg{color:var(--er);min-height:1.4em;margin:8px 0}
details{color:var(--mu);margin-top:16px}
details input{margin-top:8px}
.pw{position:relative;flex:1}
.pw input{padding-right:48px}
#eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:6px 8px;border:0;background:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#eye svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arca{display:block;margin:4px 0 0 auto;padding:4px 12px;font-size:.78rem;border-radius:8px}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:8px;flex-wrap:wrap;z-index:3}
#bar .who{flex:1 0 100%;font-size:.85rem;color:var(--mu)}
#bar button{flex:1}
#bar .x{flex:0 0 auto}
body.bar main{padding-bottom:130px}
body.bar #toast{bottom:calc(120px + env(safe-area-inset-bottom))}
#view{display:none}
.top{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.info{color:var(--mu);font-size:.85rem;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.card h2{font-size:.95rem;margin:0 0 2px}
.r{display:flex;align-items:center;gap:6px;padding:2px 0}
.r span{color:var(--mu);font-size:.72rem;width:74px;flex:none}
.r b{flex:1;font-size:.88rem;font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all}
.r button{padding:3px 9px;font-size:.78rem;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>Estudio Nexo - ARCA Clave Fiscal</h1>
    <form id="f" autocomplete="off">
      <div class="pw">
        <input id="pw" type="password" placeholder="Contraseña" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" id="eye" aria-label="Mantener presionado para ver la contraseña"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button class="p" type="submit" id="go">Abrir</button>
    </form>
    <p id="msg" role="alert"></p>
    <details>
      <summary>Abrir un archivo descargado</summary>
      <input id="file" type="file" accept=".xlsx">
    </details>
  </section>
  <section id="view">
    <div class="top">
      <input id="q" type="search" placeholder="Buscar nombre o CUIT" autocomplete="off">
      <button id="close" type="button">Cerrar</button>
    </div>
    <div class="info" id="info"></div>
    <div id="list"></div>
  </section>
</main>
<div id="bar"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
