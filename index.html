<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src https://*.dropboxusercontent.com https://www.dropbox.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Consulta</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1a5fb4;--bd:#dcdcd6;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#ecece8;--mu:#9a9a94;--ac:#7fb0ff;--bd:#383836;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:8px 0 16px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:12px;background:var(--card);color:var(--tx)}
input{width:100%}
button{cursor:pointer;color:var(--ac);font-weight:600}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
form{display:flex;gap:8px}
#msg{color:var(--er);min-height:1.4em;margin:8px 0}
details{color:var(--mu);margin-top:16px}
details input{margin-top:8px}
#view{display:none}
.top{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.info{color:var(--mu);font-size:.85rem;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:1rem;margin:0 0 8px}
.r{display:flex;align-items:center;gap:8px;padding:4px 0}
.r span{color:var(--mu);font-size:.8rem;width:84px;flex:none}
.r b{flex:1;font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all}
.r button{padding:6px 10px;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>EStudio Nexo - ARCA-Consulta de claves</h1>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Contraseña" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="p" type="submit" id="go">Abrir</button>
    </form>
    <p id="msg" role="alert"></p>
    <details>
      <summary>Abrir un archivo descargado</summary>
      <input id="file" type="file" accept=".xlsx">
    </details>
  </section>
  <section id="view">
    <div class="top">
      <input id="q" type="search" placeholder="Buscar nombre o CUIT" autocomplete="off">
      <button id="close" type="button">Cerrar</button>
    </div>
    <div class="info" id="info"></div>
    <div id="list"></div>
  </section>
</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
